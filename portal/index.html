<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Investor Portal — Beck Investment Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300..700;1,300..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --page: #F1EBDD; --surface: #FBF7EE; --white: #FFFDF8;
    --ink: #2B2724; --ink-2: #5C544A; --muted: #8C8172;
    --hairline: rgba(43,39,36,0.16);
    --oxblood: #5A1F24; --oxblood-lt: #7A2E34; --saddle: #A9784A;
  }
  body {
    background: var(--page); color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03; pointer-events: none; z-index: 100;
  }
  a { color: var(--oxblood); text-decoration: none; font-weight: 600; }
  a:hover { color: var(--oxblood-lt); }
  .login-page {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 48px 20px;
  }
  .login-card {
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 3px solid var(--oxblood);
    padding: 44px 40px 36px; text-align: center;
  }
  .login-seal { width: 88px; height: 88px; margin: 0 auto 16px; display: block; color: var(--oxblood); }
  .login-word {
    font-family: 'Bitter', serif; font-weight: 650; font-size: 15px;
    letter-spacing: 0.34em; text-transform: uppercase; color: var(--oxblood);
  }
  .login-sub {
    font-size: 10.5px; font-weight: 500; letter-spacing: 0.46em;
    text-transform: uppercase; color: var(--muted); margin: 12px 0 30px;
  }
  .field { text-align: left; margin-bottom: 16px; }
  .field label {
    display: block; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-2); margin-bottom: 7px;
  }
  .field input {
    width: 100%; background: var(--white);
    border: 1px solid var(--hairline); color: var(--ink);
    font-family: 'Source Sans 3', sans-serif; font-size: 15px;
    padding: 12px 14px; outline: none; transition: border-color .25s ease;
  }
  .field input:focus { border-color: var(--saddle); }
  .btn-brand {
    width: 100%; margin-top: 8px;
    background: var(--oxblood); color: #F5EFE3; border: none;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.26em; text-transform: uppercase;
    padding: 14px 18px; cursor: pointer; transition: background .25s ease;
  }
  .btn-brand:hover { background: var(--oxblood-lt); }
  .btn-brand[disabled] { opacity: .6; cursor: default; }
  .login-error {
    margin-top: 16px; padding: 10px 14px;
    border: 1px solid rgba(90,31,36,0.4);
    background: rgba(90,31,36,0.06);
    color: var(--oxblood); font-size: 13px; text-align: left;
  }
  .login-foot {
    margin-top: 28px; padding-top: 20px;
    border-top: 1px solid var(--hairline);
    font-size: 12px; letter-spacing: 0.1em;
    color: var(--muted); line-height: 1.9;
  }
  .login-back { margin-top: 26px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
</style>
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <svg class="login-seal" viewBox="0 0 100 100" role="img" aria-label="Beck Investment Group Diamond B mark">
      <g stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 50 6 L 94 50 L 50 94 L 6 50 Z"/>
        <line x1="40" y1="28" x2="40" y2="72"/>
        <path d="M 40 28 H 51 A 11 11 0 0 1 51 50 H 40"/>
        <path d="M 40 50 H 54 A 11 11 0 0 1 54 72 H 40"/>
      </g>
    </svg>
    <div class="login-word">Beck Investment Group</div>
    <div class="login-sub">Investor Portal</div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••••">
      </div>
      <button class="btn-brand" id="signin-btn" type="submit">Sign In</button>
    </form>

    <div class="login-error" id="login-error" role="alert" hidden>That email and password didn't match. Check them and try again.</div>

    <div class="login-foot">
      BIG Growth Fund I, LP &nbsp;·&nbsp; Texas Hill Country<br>
      Access limited to authorized users
    </div>
  </div>
  <div class="login-back"><a href="../">← beckfunds.com</a></div>
</div>

  var form = document.getElementById('login-form');
  var errBox = document.getElementById('login-error');
  var btn = document.getElementById('signin-btn');

  function fromB64(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function deriveKey(email, password) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(email + ':' + password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: fromB64(VAULT.salt), iterations: VAULT.iterations, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }

  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(VAULT.iv) }, key, fromB64(VAULT.data));
  }

  function openPortal(buf, name) {
    try {
      sessionStorage.setItem('big-demo-authed', '1');
      sessionStorage.setItem('big-demo-name', name || '');
    } catch (e) {}
    var html = new TextDecoder().decode(buf);
    document.open();
    document.write(html);
    document.close();
  }

  function nameFrom(email) {
    var n = email.split('@')[0].replace(/[._-]+/g, ' ').trim();
    return n ? n.charAt(0).toUpperCase() + n.slice(1) : '';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim().toLowerCase();
    var password = document.getElementById('password').value;
    btn.disabled = true; btn.textContent = 'Unlocking…';
    deriveKey(email, password)
      .then(function (key) {
        return decryptWith(key).then(function (buf) {
          return crypto.subtle.exportKey('raw', key).then(function (raw) {
            try {
              sessionStorage.setItem('big-key', btoa(String.fromCharCode.apply(null, new Uint8Array(raw))));
            } catch (e) {}
            openPortal(buf, nameFrom(email));
          });
        });
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Sign In';
        errBox.hidden = false;
      });
  });

  // Same-tab reload: re-open with the session key without asking again.
  try {
    var saved = sessionStorage.getItem('big-key');
    if (saved) {
      crypto.subtle.importKey('raw', fromB64(saved), { name: 'AES-GCM' }, false, ['decrypt'])
        .then(function (key) { return decryptWith(key); })
        .then(function (buf) { openPortal(buf, sessionStorage.getItem('big-demo-name')); })
        .catch(function () { try { sessionStorage.removeItem('big-key'); } catch (e) {} });
    }
  } catch (e) {}
})();
</script>
