<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beck &amp; Co. | Land &amp; Capital, Texas Hill Country</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300..700;1,300..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --page:      #F1EBDD;
    --ink:       #2B2724;
    --ink-2:     #5C544A;
    --muted:     #8C8172;
    --oxblood:   #5A1F24;
    --oxblood-lt:#7A2E34;
    --saddle:    #A9784A;
    --brass:     #8C6A3F;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
    overflow-x: hidden;
  }

  /* Paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 100;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    z-index: 1;
  }

  /* Mark */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }
  .wordmark {
    font-family: 'Bitter', serif;
    font-weight: 600;
    font-size: clamp(38px, 8.4vw, 74px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--oxblood);
    padding-left: 0.22em;
    line-height: 1.04;
    text-align: center;
  }
  .descriptor {
    font-family: 'Bitter', serif;
    font-weight: 600;
    font-size: clamp(9px, 1.5vw, 12.5px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--brass);
    padding-left: 0.34em;
    margin-top: 14px;
    text-align: center;
  }

  .rule {
    width: clamp(160px, 28vw, 280px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--saddle), transparent);
    margin: 22px auto;
    opacity: 0;
    animation: fadeIn 1.4s ease 0.8s forwards;
  }

  .tagline {
    font-family: 'Bitter', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 3.2vw, 26px);
    color: var(--ink-2);
    text-align: center;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 1.0s forwards;
  }

  /* Coming soon block */
  .soon-block {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;
  }

  .soon-label {
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
    padding-left: 0.5em;
  }

  .dots { display: flex; gap: 10px; align-items: center; }
  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--saddle);
    opacity: 0.5;
  }
  .dot.active {
    background: var(--oxblood);
    opacity: 1;
    width: 6px; height: 6px;
  }

  .contact {
    font-weight: 400;
    font-size: clamp(12px, 1.6vw, 14px);
    letter-spacing: 0.14em;
    color: var(--muted);
    text-align: center;
  }
  .contact a {
    color: var(--oxblood);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .contact a:hover { color: var(--oxblood-lt); }


  .bottom-rule {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, var(--saddle) 30%, var(--oxblood) 50%, var(--saddle) 70%, transparent 100%);
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards;
  }

  @media (max-width: 520px) {
    .wordmark { font-size: clamp(28px, 8vw, 40px); letter-spacing: 0.15em; padding-left: 0.15em; }
    .descriptor { letter-spacing: 0.24em; padding-left: 0.24em; font-size: 9px; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .wordmark, .descriptor, .rule, .tagline, .soon-block, .bottom-rule { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<main class="page">

  <div class="logo-wrap">

    <div class="wordmark">Beck &amp; Co.</div>
    <div class="descriptor">Land &amp; Capital &middot; Texas Hill Country</div>

    <div class="rule"></div>
    <div class="tagline">Built for More.</div>

  </div>

  <div class="soon-block">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <div class="soon-label">Launching 2026</div>
    <div class="contact">
      <a href="portal/">Investor Portal &rarr;</a>
    </div>
  </div>

</main>

<div class="bottom-rule"></div>

</body>
</html>
