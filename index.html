<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beck Investment Group — Built for More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,300..700;1,300..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --page:      #F1EBDD;
    --ink:       #2B2724;
    --ink-2:     #5C544A;
    --muted:     #8C8172;
    --oxblood:   #5A1F24;
    --oxblood-lt:#7A2E34;
    --saddle:    #A9784A;
    --brass:     #8C6A3F;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
    overflow-x: hidden;
  }

  /* Paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.03;
    pointer-events: none;
    z-index: 100;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    z-index: 1;
  }

  /* Mark */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
  }
  .mark {
    width: clamp(300px, 52vw, 480px);
    height: auto;
    margin-bottom: 6px;
  }

  .rule {
    width: clamp(160px, 28vw, 280px);
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--saddle), transparent);
    margin: 22px auto;
    opacity: 0;
    animation: fadeIn 1.4s ease 0.8s forwards;
  }

  .tagline {
    font-family: 'Bitter', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 3.2vw, 26px);
    color: var(--ink-2);
    text-align: center;
    letter-spacing: 0.04em;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 1.0s forwards;
  }

  /* Coming soon block */
  .soon-block {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) 1.3s forwards;
  }

  .soon-label {
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
    padding-left: 0.5em;
  }

  .dots { display: flex; gap: 10px; align-items: center; }
  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--saddle);
    opacity: 0.5;
  }
  .dot.active {
    background: var(--oxblood);
    opacity: 1;
    width: 6px; height: 6px;
  }

  .contact {
    font-weight: 400;
    font-size: clamp(12px, 1.6vw, 14px);
    letter-spacing: 0.14em;
    color: var(--muted);
    text-align: center;
  }
  .contact a {
    color: var(--oxblood);
    font-weight: 600;
    text-decoration: none;
    transition: color 0.3s ease;
  }
  .contact a:hover { color: var(--oxblood-lt); }

  .fund-pill {
    border: 1px solid var(--saddle);
    padding: 9px 24px;
    font-family: 'Bitter', serif;
    font-weight: 500;
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: 0.26em;
    color: var(--oxblood);
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    animation: fadeIn 1.4s ease 1.6s forwards;
  }

  .bottom-rule {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, var(--saddle) 30%, var(--oxblood) 50%, var(--saddle) 70%, transparent 100%);
    opacity: 0;
    animation: fadeIn 2s ease 2s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo-wrap, .wordmark, .rule, .tagline, .soon-block, .fund-pill, .bottom-rule { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<main class="page">

  <div class="logo-wrap">

    <!-- Flanked lockup: BECK ◆B GROUP · INVESTMENT — diamond optically centered (24px painted gaps) -->
    <svg class="mark" viewBox="0 0 420 120" role="img" aria-label="Beck Investment Group — Diamond B lockup">
      <g transform="translate(-36.1 0)">
        <text x="185" y="60" text-anchor="end" font-family="Bitter, serif" font-weight="600" font-size="30" letter-spacing="9" fill="#5A1F24">BECK</text>
        <g stroke="#5A1F24" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M 230 19 L 260 49 L 230 79 L 200 49 Z"/>
          <line x1="222" y1="35" x2="222" y2="63"/>
          <path d="M 222 35 H 229 A 7 7 0 0 1 229 49 H 222"/>
          <path d="M 222 49 H 231 A 7 7 0 0 1 231 63 H 222"/>
        </g>
        <text x="284" y="60" text-anchor="start" font-family="Bitter, serif" font-weight="600" font-size="30" letter-spacing="9" fill="#5A1F24">GROUP</text>
        <text x="233.5" y="103" text-anchor="middle" font-family="Bitter, serif" font-weight="600" font-size="12" letter-spacing="7" fill="#8C6A3F">INVESTMENT</text>
      </g>
    </svg>

    <div class="rule"></div>
    <div class="tagline">Built for More.</div>

  </div>

  <div class="soon-block">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <div class="soon-label">Launching 2026</div>
    <div class="contact">
      <a href="portal/">Investor Portal &rarr;</a>
    </div>
  </div>

  <div class="fund-pill" style="margin-top: 40px;">
    BIG Growth Fund I, LP &nbsp;&middot;&nbsp; Texas Hill Country
  </div>

</main>

<div class="bottom-rule"></div>

</body>
</html>
